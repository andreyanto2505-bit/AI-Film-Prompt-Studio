
name: Build AI Film Prompt Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'AIFilmPromptStudio-source-v1.0.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q AIFilmPromptStudio-source-v1.0.zip -d .

      - name: Build APK
        run: gradle -p AIFilmPromptStudio --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Film-Prompt-Studio-APK
          path: AIFilmPromptStudio/app/build/outputs/apk/debug/app-debug.apk
